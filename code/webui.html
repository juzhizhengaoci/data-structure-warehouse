<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仓库管理系统 · 数据结构课程设计</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f0; --text:#1f2937;
    --muted:#6b7280; --primary:#2563eb; --primary-d:#1d4ed8;
    --green:#059669; --red:#dc2626; --amber:#d97706;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:4px}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;border:1px solid #e0e7ff}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat.warn .v{color:var(--red)}
  .stat.ok .v{color:var(--green)}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;letter-spacing:.4px}
  .card .bd{padding:14px 16px}

  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fbfcfe;color:var(--text);outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}

  button{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;transition:.15s;font-weight:500}
  .btn{background:var(--primary);color:#fff}
  .btn:hover{background:var(--primary-d)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:#c7d2fe;color:var(--primary-d)}
  .btn-danger{background:#fff;border-color:#fecaca;color:var(--red)}
  .btn-danger:hover{background:#fef2f2}
  .btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
  .full{width:100%;margin-top:14px}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
  .toolbar input{width:220px}
  .toolbar .sp{flex:1}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfe;position:sticky;top:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f8faff}
  tr.low{background:#fff7f7}
  tr.low:hover{background:#ffeeee}
  tr.low td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px}
  .tag.low{background:#fee2e2;color:#991b1b}
  .tag.ok{background:#dcfce7;color:#166534}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  .result{display:none;margin:0 16px 16px;border:1px dashed #c7d2fe;border-radius:10px;background:#f8faff;padding:12px 14px;font-size:13px}
  .result.show{display:block}
  .result .hd{font-weight:600;color:var(--primary-d);margin-bottom:8px}
  .compare{width:100%;font-size:13px;border-collapse:collapse}
  .compare td,.compare th{border:none;padding:5px 8px;border-bottom:1px solid #e6ecff;white-space:nowrap}
  .compare th{background:transparent;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;
         box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;pointer-events:none;max-width:80vw;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#991b1b}
  .toast.ok{background:#065f46}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>仓库管理系统
      <small>数据结构课程设计 · 题目19 · 链式存储 · 后端由 C 语言实现（Winsock HTTP）</small>
    </h1>
    <div class="badge" id="status">连接中…</div>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">货品种类</div><div class="v" id="s-kinds">–</div></div>
    <div class="stat"><div class="k">库存总数量</div><div class="v" id="s-qty">–</div></div>
    <div class="stat ok"><div class="k">库存总金额（元）</div><div class="v" id="s-amount">–</div></div>
    <div class="stat warn"><div class="k">低库存预警（阈值 <span id="s-limit">–</span>）</div><div class="v" id="s-low">–</div></div>
  </div>

  <div class="grid">

    <!-- ============ 左侧操作面板 ============ -->
    <div>
      <div class="card">
        <h2>入库（同编号+厂家+批次+单价 自动累加）</h2>
        <div class="bd">
          <div class="row">
            <div><label>货品编号 *</label><input id="in-id" placeholder="P011"></div>
            <div><label>批次</label><input id="in-batch" placeholder="20250901"></div>
          </div>
          <label>货品名称 *</label><input id="in-name" placeholder="卷尺">
          <label>生产厂家</label><input id="in-factory" placeholder="得力">
          <div class="row">
            <div><label>入库数量 *</label><input id="in-qty" type="number" min="1" placeholder="100"></div>
            <div><label>单价（元）*</label><input id="in-price" type="number" step="0.01" min="0" placeholder="15.50"></div>
          </div>
          <button class="btn full" onclick="doIn()">执行入库</button>
        </div>
      </div>

      <div class="card">
        <h2>出库 / 删除</h2>
        <div class="bd">
          <label>货品编号</label>
          <div class="row">
            <div><input id="op-id" placeholder="P001"></div>
            <div><input id="op-qty" type="number" min="1" placeholder="数量"></div>
          </div>
          <div class="row" style="margin-top:12px">
            <div><button class="btn full" style="margin:0" onclick="doOut()">出库</button></div>
            <div><button class="btn-danger full" style="margin:0" onclick="doDel()">删除</button></div>
          </div>
          <div class="hint">出库会校验：编号必须存在、数量 &gt; 0 且不超过当前库存。</div>
        </div>
      </div>

      <div class="card">
        <h2>排序与算法对比</h2>
        <div class="bd">
          <div class="row">
            <div><label>排序字段</label>
              <select id="so-field"><option value="1">单价</option><option value="2">库存数量</option></select>
            </div>
            <div><label>方向</label>
              <select id="so-asc"><option value="1">升序</option><option value="0">降序</option></select>
            </div>
          </div>
          <label>算法</label>
          <select id="so-algo">
            <option value="3">两种算法性能对比</option>
            <option value="1">冒泡排序</option>
            <option value="2">选择排序</option>
          </select>
          <button class="btn full" onclick="doSort()">执行排序</button>
        </div>
      </div>

      <div class="card">
        <h2>其他操作</h2>
        <div class="bd">
          <div class="row">
            <div><label>库存警戒值</label><input id="op-limit" type="number" min="0" placeholder="20"></div>
            <div style="display:flex;align-items:flex-end"><button class="btn-ghost full" style="margin:0" onclick="doLimit()">设置</button></div>
          </div>
          <div class="row" style="margin-top:12px">
            <div><button class="btn-ghost full" style="margin:0" onclick="doExport()">导出盘点表</button></div>
            <div><button class="btn-ghost full" style="margin:0" onclick="doReload()">重新载入</button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ 右侧数据区 ============ -->
    <div>
      <div class="card">
        <div class="toolbar">
          <strong style="font-size:13px">货品清单</strong>
          <input id="q" placeholder="搜索 编号 / 名称 / 厂家…" oninput="render()">
          <div class="sp"></div>
          <button class="btn-ghost btn-sm" onclick="load()">刷新</button>
        </div>
        <div class="result" id="result"></div>
        <div style="overflow:auto;max-height:560px">
          <table>
            <thead>
              <tr>
                <th>编号</th><th>名称</th><th>生产厂家</th><th>批次</th>
                <th class="num">数量</th><th class="num">单价</th><th class="num">金额</th>
                <th>状态</th><th style="text-align:right">操作</th>
              </tr>
            </thead>
            <tbody id="tb"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" style="display:none">暂无货品，先在左侧录入一条试试</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let DATA = { goods: [], stats: {} };

/* ---------- 通用请求 ---------- */
async function api(path, data) {
  const opt = data
    ? { method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body: new URLSearchParams(data).toString() }
    : {};
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast ' + (type || ''); }, 3200);
}

/* ---------- 数据加载与渲染 ---------- */
async function load() {
  try {
    const d = await api('/api/list');
    if (!d.ok) throw new Error(d.msg || '接口异常');
    DATA = d;
    document.getElementById('status').textContent = '● 服务已连接 · C 语言后端';
    render();
  } catch (e) {
    document.getElementById('status').textContent = '● 服务未连接';
    toast('无法连接后端服务，请确认 server.exe 正在运行', 'err');
  }
}

function render() {
  const s = DATA.stats || {};
  document.getElementById('s-kinds').textContent = s.kinds ?? '–';
  document.getElementById('s-qty').textContent = s.totalQty ?? '–';
  document.getElementById('s-amount').textContent = (s.totalAmount ?? 0).toFixed(2);
  document.getElementById('s-low').textContent = s.lowCount ?? '–';
  document.getElementById('s-limit').textContent = s.lowLimit ?? '–';

  const kw = (document.getElementById('q').value || '').trim().toLowerCase();
  const rows = (DATA.goods || []).filter(g =>
    !kw || [g.id, g.name, g.factory, g.batch].join(' ').toLowerCase().includes(kw));

  const tb = document.getElementById('tb');
  tb.innerHTML = rows.map(g => `
    <tr class="${g.low ? 'low' : ''}">
      <td><code style="font-size:12px">${esc(g.id)}</code></td>
      <td>${esc(g.name)}</td>
      <td>${esc(g.factory)}</td>
      <td>${esc(g.batch)}</td>
      <td class="num">${g.qty}</td>
      <td class="num">${g.price.toFixed(2)}</td>
      <td class="num"><strong>${g.amount.toFixed(2)}</strong></td>
      <td>${g.low ? '<span class="tag low">需补货</span>' : '<span class="tag ok">充足</span>'}</td>
      <td style="text-align:right">
        <button class="btn-ghost btn-sm" onclick="pick('${esc(g.id)}')">取号</button>
        <button class="btn-danger btn-sm" onclick="quickDel('${esc(g.id)}')">删除</button>
      </td>
    </tr>`).join('');

  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function pick(id) {
  document.getElementById('op-id').value = id;
  document.getElementById('in-id').value = '';
  toast('已填入编号 ' + id + '，可直接出库或删除', 'ok');
}

/* ---------- 业务操作 ---------- */
function val(id) { return document.getElementById(id).value.trim(); }

async function doIn() {
  const body = {
    id: val('in-id'), name: val('in-name'), factory: val('in-factory'),
    batch: val('in-batch'), qty: val('in-qty'), price: val('in-price')
  };
  if (!body.id || !body.name) return toast('编号和名称必填', 'err');
  if (!body.qty || +body.qty <= 0) return toast('入库数量必须大于 0', 'err');
  if (body.price === '' || +body.price < 0) return toast('请填写合法单价', 'err');

  const d = await api('/api/in', body);
  toast(d.msg, d.ok ? 'ok' : 'err');
  if (d.ok) { ['in-id','in-name','in-factory','in-batch','in-qty','in-price'].forEach(i => document.getElementById(i).value = ''); load(); }
}

async function doOut() {
  const body = { id: val('op-id'), qty: val('op-qty') };
  if (!body.id) return toast('请输入货品编号', 'err');
  const d = await api('/api/out', body);
  toast(d.msg, d.ok ? 'ok' : 'err');
  if (d.ok) { document.getElementById('op-qty').value = ''; load(); }
}

async function doDel() {
  const id = val('op-id');
  if (!id) return toast('请输入货品编号', 'err');
  if (!confirm('确认删除货品 ' + id + ' ？此操作会同步写入数据文件。')) return;
  const d = await api('/api/del', { id });
  toast(d.msg, d.ok ? 'ok' : 'err');
  if (d.ok) load();
}

async function quickDel(id) {
  document.getElementById('op-id').value = id;
  await doDel();
}

async function doSort() {
  const d = await api('/api/sort', {
    field: val('so-field'), asc: val('so-asc'), algo: val('so-algo')
  });
  toast(d.msg, d.ok ? 'ok' : 'err');

  const box = document.getElementById('result');
  if (d.ok && d.cmp1 !== undefined) {
    box.innerHTML = `
      <div class="hd">排序算法性能对比（本次实测，可直接用于报告第 5 章）</div>
      <table class="compare">
        <tr><th>算法</th><th>比较次数</th><th>移动次数</th><th>时间复杂度</th><th>空间</th></tr>
        <tr><td>冒泡排序</td><td>${d.cmp1}</td><td>${d.mov1}</td><td>O(N²)，最好 O(N)</td><td>O(1)</td></tr>
        <tr><td>选择排序</td><td>${d.cmp2}</td><td>${d.mov2}</td><td>O(N²)，比较次数恒为 N(N-1)/2</td><td>O(1)</td></tr>
      </table>`;
    box.classList.add('show');
  } else if (d.ok) {
    box.innerHTML = `<div class="hd">排序完成</div>${esc(d.msg)}`;
    box.classList.add('show');
  }
  load();
}

async function doLimit() {
  const v = val('op-limit');
  if (v === '') return toast('请输入警戒值', 'err');
  const d = await api('/api/limit', { limit: v });
  toast(d.msg, d.ok ? 'ok' : 'err');
  if (d.ok) load();
}

async function doExport() {
  const d = await api('/api/export');
  toast(d.msg, d.ok ? 'ok' : 'err');
}

async function doReload() {
  const d = await api('/api/reload');
  toast(d.msg, d.ok ? 'ok' : 'err');
  load();
}

/* 回车快捷提交 */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const id = e.target.id;
    if (id.startsWith('in-')) doIn();
    else if (id === 'op-qty') doOut();
    else if (id === 'op-limit') doLimit();
  }
});

load();
setInterval(load, 8000);   /* 每 8 秒自动刷新 */
</script>
</body>
</html>
